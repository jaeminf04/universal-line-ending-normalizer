[project]
name = "universal-line-ending-normalizer"
version = "0.1.1"
description = "Detects and converts between CR, LF, CRLF, and Unicode line separators on text streams or strings."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
